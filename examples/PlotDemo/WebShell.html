<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PTGL Plot - Plot viewer</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f6f8fa; color:#202833; font:14px monospace; color-scheme:light }
    #canvas { display:block; width:100%; height:100%; outline:none; touch-action:none }
    #status { position:fixed; top:45%; width:100%; text-align:center; pointer-events:none }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="PTGL Plot plots"></canvas>
  <div id="status">Loading PTGL Plot...</div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized() { document.getElementById('status').hidden = true; Module.canvas.focus(); },
      onAbort(reason) { const s = document.getElementById('status'); s.hidden = false; s.textContent = 'Unable to start PTGL Plot: ' + reason; },
      printErr: console.error
    };
    Module.canvas.addEventListener('contextmenu', e => e.preventDefault());
    Module.canvas.addEventListener('pointerdown', () => Module.canvas.focus());
  </script>
  {{{ SCRIPT }}}
</body>
</html>
